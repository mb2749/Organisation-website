<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Martha's Website</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
 
<div class="auth-shell">
  <div class="auth-card">
    <div class="wordmark auth-wordmark">Martha's Website</div>
    <h1 class="auth-title">Sign in</h1>
    {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
    <form class="auth-form" method="post" action="{{ url_for('login') }}">
      <label>
        Username
        <input type="text" name="username" autocomplete="username" autofocus required>
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn-text auth-submit">Sign in</button>
    </form>
    <p class="auth-switch">No account yet? <a href="{{ url_for('signup') }}">Create one</a></p>
  </div>
</div>
 
</body>
</html>
