<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martha's Website</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
 
<div class="shell" id="shell">
  <aside class="sidebar">
    <div class="wordmark-row">
      <div class="wordmark">Martha's Website</div>
      <button class="icon-ghost sidebar-toggle" id="hide-sidebar" title="Hide toolbar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M5 10l0 0"/></svg>
      </button>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="today">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        Today
      </button>
      <button class="nav-item" data-view="calendar">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Calendar
      </button>
      <button class="nav-item" data-view="tasks">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Tasks
      </button>
      <button class="nav-item" data-view="reminders">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        Reminders
      </button>
    </nav>
    <div class="sidebar-footer">
      <div id="sidebar-date"></div>
      <div class="sidebar-user">
        <span>{{ username }}</span>
        <a href="{{ url_for('logout') }}" class="logout-link">Sign out</a>
      </div>
    </div>
  </aside>
 
  <button class="show-sidebar-btn" id="show-sidebar" title="Show toolbar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
  </button>
 
  <main class="main" id="main"></main>
</div>
 
<script src="{{ url_for('static', filename='site.js') }}"></script>
</body>
</html>
